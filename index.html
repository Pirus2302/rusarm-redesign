<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Русармкомплект – прототипы главной</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy-800:#123A6B;--navy-600:#1C4E8F;--accent:#C2500B;--ink:#16222E;--line:#DCE3EC;--r:4px}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fff;color:var(--ink);font:400 17px/1.6 'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
ul{list-style:none;margin:0;padding:clamp(24px,6vw,48px);display:grid;gap:12px;width:min(520px,100%)}
a{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px;border:1px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none;font-weight:600;letter-spacing:-.01em;transition:border-color .25s,transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s cubic-bezier(.16,1,.3,1)}
a em{font-style:normal;color:var(--accent)}
a:hover{border-color:var(--navy-600);transform:translateY(-2px);box-shadow:0 14px 34px rgba(18,58,107,.08)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<ul>
  <li><a href="v1.html">Вариант 1 <em>→</em></a></li>
  <li><a href="v2.html">Вариант 2 <em>→</em></a></li>
  <li><a href="v3.html">Вариант 3 <em>→</em></a></li>
</ul>
</body>
</html>
